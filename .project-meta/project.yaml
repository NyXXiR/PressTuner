schemaVersion: 1
projectId: press-tuner
facts:
  displayName: PressTuner
  publicationStatus: public
  summary:
    ko: "brieFFlow는 출시·행사 정보와 팀 문서를 검색해 근거 있는 보도자료 초안을 만들고, 인용·주장 검증과 평가 게이트로 결과 품질을 관리하는 AI 워크스페이스입니다. 자기소개서 초안 기능도 제공하지만, 제품의 중심은 팀 단위 보도자료 워크플로입니다."
    en: "brieFFlow retrieves launch facts and team knowledge to draft grounded press releases, then manages output quality with citation and claim checks plus evaluation gates. Career-draft support remains available, while the core product is the team press-release workflow."
  intent:
    ko: "보도자료 초안은 그럴듯하게 나와도 근거가 맞는지, 고친 뒤 실제로 나아졌는지 확인할 방법이 없었습니다. 검색된 근거를 초안과 함께 보여주고 변경 전후를 같은 평가 기준으로 비교할 수 있게 만들려고 시작했습니다."
    en: "A plausible-looking press release still left two questions unanswered: is it actually grounded, and did the last change make it better? I started this to show retrieved evidence beside the draft and compare before and after against the same evaluation criteria."
